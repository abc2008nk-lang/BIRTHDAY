<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, #ff9a9e, transparent 40%),
        radial-gradient(circle at bottom right, #a18cd1, transparent 40%),
        linear-gradient(135deg, #ff758c, #ff7eb3, #8e7dff);
      color: white;
      padding: 20px;
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      filter: blur(60px);
      top: -100px;
      right: -80px;
      animation: glow 5s infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.3);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 600px);
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      animation: cardAppear 1s ease-out;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cake {
      font-size: 75px;
      animation: bounce 2s infinite;
      margin-bottom: 15px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    .small-text {
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 72px);
      line-height: 1.05;
      margin-bottom: 15px;
      font-weight: 800;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      animation: titleGlow 2s infinite alternate;
    }

    @keyframes titleGlow {
      from {
        text-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
      }
      to {
        text-shadow:
          0 0 10px #fff,
          0 0 30px #ffb6d9,
          0 0 50px #ff69b4;
      }
    }

    .name {
      color: #fff6a8;
    }

    .message {
      font-size: 18px;
      line-height: 1.7;
      max-width: 500px;
      margin: 0 auto 25px;
      opacity: 0.95;
    }

    .heart {
      display: inline-block;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.25);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.2);
      }
    }

    button {
      border: none;
      outline: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: linear-gradient(135deg, #fff, #ffe3f0);
      color: #e94f8b;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: scale(0.96);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -20px;
      z-index: 10;
      width: 10px;
      height: 18px;
      opacity: 0.9;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translateY(110vh)
          translateX(var(--drift))
          rotate(720deg);
        opacity: 0;
      }
    }

    /* Floating balloons */
    .balloon {
      position: fixed;
      bottom: -100px;
      font-size: 55px;
      z-index: 1;
      opacity: 0.75;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-5deg);
        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      90% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-120vh) rotate(10deg);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .cake {
        font-size: 60px;
      }

      .small-text {
        font-size: 12px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: clamp(38px, 13vw, 58px);
      }

      .message {
        font-size: 16px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        max-width: 250px;
      }

      .balloon {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="cake">🎂</div>

    <div class="small-text">A special day for a special person</div>

    <!-- Change the name here -->
    <h1>
      Happy Birthday<br>
      <span class="name">Divyanshi!</span> 🎉
    </h1>

    <p class="message">
      Wishing you a day filled with happiness, laughter,
      unforgettable memories, and lots of love.
      May this new year of your life bring you
      everything you've been wishing for!
      <span class="heart">❤️</span>
    </p>

    <button onclick="celebrate()">
      🎊 Celebrate Again
    </button>
  </div>

  <script>
    const colors = [
      "#ff4d6d",
      "#ffd166",
      "#06d6a0",
      "#4cc9f0",
      "#ffffff",
      "#c77dff",
      "#ff9f1c"
    ];

    function createConfetti(count = 120) {
      for (let i = 0; i < count; i++) {
        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width = Math.random() * 8 + 5 + "px";
        confetti.style.height = Math.random() * 14 + 8 + "px";

        confetti.style.setProperty(
          "--drift",
          (Math.random() * 300 - 150) + "px"
        );

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 7000);
      }
    }

    function createBalloons() {
      const balloonEmojis = ["🎈", "🎈", "🎈", "🎈"];

      balloonEmojis.forEach((emoji, index) => {
        const balloon = document.createElement("div");

        balloon.className = "balloon";
        balloon.textContent = emoji;

        balloon.style.left =
          (10 + index * 25 + Math.random() * 10) + "vw";

        balloon.style.animationDuration =
          (10 + Math.random() * 8) + "s";

        balloon.style.animationDelay =
          Math.random() * 5 + "s";

        document.body.appendChild(balloon);
      });
    }

    function celebrate() {
      createConfetti(180);
    }

    // Start celebration automatically
    window.addEventListener("load", () => {
      createConfetti(180);
      createBalloons();
    });
  </script>

</body>
</html>
